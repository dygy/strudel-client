name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys of main race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Tests GATE the deploy (the suite went fully green on 2026-10-09, da9ca9d).
  # format-check and lint are still advisory: they fail on code that predates
  # this workflow (228 unformatted files, 29 lint errors). Once one is clean,
  # drop its continue-on-error and it gates too.
  check:
    name: Test (gating); format, lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format-check
        continue-on-error: true

      - run: pnpm run lint
        continue-on-error: true

      - run: pnpm run test

  deploy:
    name: Build and deploy to Cloudflare
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:cloudflare

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: website
          command: deploy
